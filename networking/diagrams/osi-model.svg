<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="480" fill="#0d1117"/>
  <text x="380" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">The OSI Model — Layers &amp; DevOps Examples</text>

  <!-- Layer bands: y positions from top (L7) to bottom (L1) -->
  <!-- each band height 54, starting y=56 -->

  <!-- L7 Application -->
  <g>
    <rect x="60" y="56" width="300" height="50" rx="6" fill="#1f6feb"/>
    <text x="75" y="87" fill="#ffffff" font-size="15" font-weight="600">7 · Application</text>
    <text x="380" y="87" fill="#c9d1d9" font-size="13">HTTP, DNS, SSH, SMTP</text>
  </g>

  <!-- L6 Presentation -->
  <g>
    <rect x="60" y="112" width="300" height="50" rx="6" fill="#316dca"/>
    <text x="75" y="143" fill="#ffffff" font-size="15" font-weight="600">6 · Presentation</text>
    <text x="380" y="143" fill="#c9d1d9" font-size="13">SSL/TLS, encryption, compression</text>
  </g>

  <!-- L5 Session -->
  <g>
    <rect x="60" y="168" width="300" height="50" rx="6" fill="#3b6cb0"/>
    <text x="75" y="199" fill="#ffffff" font-size="15" font-weight="600">5 · Session</text>
    <text x="380" y="199" fill="#c9d1d9" font-size="13">API sessions, auth sessions</text>
  </g>

  <!-- L4 Transport -->
  <g>
    <rect x="60" y="224" width="300" height="50" rx="6" fill="#2ea043"/>
    <text x="75" y="255" fill="#ffffff" font-size="15" font-weight="600">4 · Transport</text>
    <text x="380" y="255" fill="#c9d1d9" font-size="13">TCP, UDP, ports (nc -zv)</text>
  </g>

  <!-- L3 Network -->
  <g>
    <rect x="60" y="280" width="300" height="50" rx="6" fill="#3fb950"/>
    <text x="75" y="311" fill="#0d1117" font-size="15" font-weight="600">3 · Network</text>
    <text x="380" y="311" fill="#c9d1d9" font-size="13">IPv4/IPv6, routers (ping, traceroute)</text>
  </g>

  <!-- L2 Data Link -->
  <g>
    <rect x="60" y="336" width="300" height="50" rx="6" fill="#d29922"/>
    <text x="75" y="367" fill="#0d1117" font-size="15" font-weight="600">2 · Data Link</text>
    <text x="380" y="367" fill="#c9d1d9" font-size="13">MAC addresses, switches, ARP</text>
  </g>

  <!-- L1 Physical -->
  <g>
    <rect x="60" y="392" width="300" height="50" rx="6" fill="#e3b341"/>
    <text x="75" y="423" fill="#0d1117" font-size="15" font-weight="600">1 · Physical</text>
    <text x="380" y="423" fill="#c9d1d9" font-size="13">Cables, signals, Wi-Fi</text>
  </g>

  <!-- Direction arrows -->
  <g>
    <line x1="440" y1="70" x2="440" y2="418" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="452" y="60" fill="#8b949e" font-size="12">Sender</text>
    <text x="452" y="435" fill="#8b949e" font-size="12">Receiver</text>
    <polygon points="440,418 434,406 446,406" fill="#8b949e"/>
    <text x="470" y="240" fill="#8b949e" font-size="12" transform="rotate(90 470 240)">encapsulation ↓ / decapsulation ↑</text>
  </g>

  <text x="380" y="465" text-anchor="middle" fill="#6e7681" font-size="12">When something breaks, ask: "which layer is failing?"</text>
</svg>
